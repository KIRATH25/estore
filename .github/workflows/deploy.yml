
name: Deploy React website to GitHub Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Get project files
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend packages
        run: npm ci
        working-directory: frontend

      - name: Check backend API URL
        run: |
          if [ -z "$VITE_API_URL" ]; then
            echo "Set the VITE_API_URL Actions variable before deployment."
            exit 1
          fi
          case "$VITE_API_URL" in
            */) echo "VITE_API_URL must not end with a slash."; exit 1 ;;
          esac
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      - name: Build React website
        run: npm run build
        working-directory: frontend
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload website files
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
